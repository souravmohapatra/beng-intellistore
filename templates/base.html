<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Statement Intelligence{% endblock %}</title>
  </head>
  <body>
    {% if user.is_authenticated %}
      <header>
        <nav>
          <a href="{% url 'ledger:overview' %}">Overview</a>
          <a href="{% url 'ledger:uploads' %}">Uploads</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sign out</button>
          </form>
        </nav>
      </header>
    {% endif %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
