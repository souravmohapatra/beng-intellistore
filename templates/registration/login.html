{% extends "base.html" %}
{% block title %}Sign in — Statement Intelligence{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  {% if form.errors %}
    <p role="alert">Your username and password did not match. Please try again.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <p>
      <label for="id_username">Username</label>
      {{ form.username }}
    </p>
    <p>
      <label for="id_password">Password</label>
      {{ form.password }}
    </p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
