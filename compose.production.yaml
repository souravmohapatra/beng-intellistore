name: beng-intellistore-production

x-app-container: &app-container
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the systemd environment file}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the systemd environment file}
    POSTGRES_DB: intellistore
    POSTGRES_USER: intellistore
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    INTELLISTORE_DATA_DIR: /data
    LAPTOP_CONTROLLER_URL: ${LAPTOP_CONTROLLER_URL:-}
    LAPTOP_CONTROLLER_TIMEOUT_SECONDS: ${LAPTOP_CONTROLLER_TIMEOUT_SECONDS:-5}
    WORKER_KEEP_AWAKE_SECONDS: ${WORKER_KEEP_AWAKE_SECONDS:-1200}
    WORKER_KEEP_AWAKE_RENEW_BEFORE_SECONDS: ${WORKER_KEEP_AWAKE_RENEW_BEFORE_SECONDS:-300}
    WORKER_KEEP_AWAKE_EXTENSION_SECONDS: ${WORKER_KEEP_AWAKE_EXTENSION_SECONDS:-600}

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellistore
      POSTGRES_USER: intellistore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellistore -d intellistore"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *app-container
    entrypoint: ["gunicorn"]
    command:
      - --bind=0.0.0.0:8000
      - --workers=2
      - --access-logfile=-
      - --error-logfile=-
      - intellistore.wsgi:application
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTELLISTORE_HTTP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${INTELLISTORE_HOST_DATA_DIR:?Set INTELLISTORE_HOST_DATA_DIR to an existing local directory}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/login/', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  release-jobs:
    <<: *app-container
    command: ["release_due_jobs"]
    restart: "no"

volumes:
  postgres-data:
