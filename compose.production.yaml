name: beng-intellistore-production

x-app-container: &app-container
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:${INTELLISTORE_NO_NEW_PRIVILEGES:-true}
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the systemd environment file}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the systemd environment file}
    POSTGRES_DB: intellistore
    POSTGRES_USER: intellistore
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    INTELLISTORE_DATA_DIR: /data
    BACKUP_STATUS_FILE: /status/backup.json
    LAPTOP_CONTROLLER_URL: ${LAPTOP_CONTROLLER_URL:-}
    LAPTOP_CONTROLLER_TIMEOUT_SECONDS: ${LAPTOP_CONTROLLER_TIMEOUT_SECONDS:-5}
    WORKER_KEEP_AWAKE_SECONDS: ${WORKER_KEEP_AWAKE_SECONDS:-1200}
    WORKER_KEEP_AWAKE_RENEW_BEFORE_SECONDS: ${WORKER_KEEP_AWAKE_RENEW_BEFORE_SECONDS:-300}
    WORKER_KEEP_AWAKE_EXTENSION_SECONDS: ${WORKER_KEEP_AWAKE_EXTENSION_SECONDS:-600}

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellistore
      POSTGRES_USER: intellistore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
    volumes:
      - type: bind
        source: ${INTELLISTORE_HOST_DATABASE_DIR:?Set INTELLISTORE_HOST_DATABASE_DIR to the dedicated local PostgreSQL directory}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellistore -d intellistore"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    <<: *app-container
    entrypoint: ["gunicorn"]
    command:
      - --bind=0.0.0.0:8000
      - --workers=2
      - --access-logfile=-
      - --error-logfile=-
      - intellistore.wsgi:application
    restart: unless-stopped
    ports:
      - "${INTELLISTORE_BIND_ADDRESS:-127.0.0.1}:${INTELLISTORE_HTTP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${INTELLISTORE_HOST_DATA_DIR:?Set INTELLISTORE_HOST_DATA_DIR to an existing local directory}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${INTELLISTORE_HOST_STATUS_DIR:?Set INTELLISTORE_HOST_STATUS_DIR to a local status directory}
        target: /status
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/login/', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  release-jobs:
    <<: *app-container
    command: ["release_due_jobs"]
    restart: "no"

  # Consistent recovery generation. Systemd only invokes Compose; the logic runs
  # in the container. The destination is a NAS mount on the mini-PC.
  backup:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/scripts/backup_generation.sh"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:${INTELLISTORE_NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: intellistore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
      PGDATABASE: intellistore
      BACKUP_DIR: /backup
      ORIGINALS_DIR: /data/originals
      STATUS_FILE: /status/backup.json
      KEEP_GENERATIONS: ${INTELLISTORE_BACKUP_GENERATIONS:-7}
    volumes:
      - type: bind
        source: ${INTELLISTORE_HOST_DATA_DIR:?Set INTELLISTORE_HOST_DATA_DIR to an existing local directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INTELLISTORE_BACKUP_DIR:?Set INTELLISTORE_BACKUP_DIR to the NAS backup directory}
        target: /backup
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_HOST_STATUS_DIR:?Set INTELLISTORE_HOST_STATUS_DIR to a local status directory}
        target: /status
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_COMPOSE_DIR:?Set INTELLISTORE_COMPOSE_DIR}
        target: /scripts
        read_only: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Isolated restore target. Never point these paths at live data.
  restore:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/scripts/restore_generation.sh"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:${INTELLISTORE_NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: intellistore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
      LIVE_DATABASE: intellistore
    volumes:
      - type: bind
        source: ${INTELLISTORE_BACKUP_DIR:?Set INTELLISTORE_BACKUP_DIR to the NAS backup directory}
        target: /backup
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INTELLISTORE_RESTORE_DIR:?Set INTELLISTORE_RESTORE_DIR to an isolated restore directory}
        target: /restore
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_COMPOSE_DIR:?Set INTELLISTORE_COMPOSE_DIR}
        target: /scripts
        read_only: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
