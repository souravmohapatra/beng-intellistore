# Recovery services layered over compose.production.yaml.
#
# Kept separate so ordinary app/worker startup never requires NAS or restore
# settings. Invoke explicitly:
#   docker compose -f compose.production.yaml -f compose.recovery.yaml run --rm backup
#   docker compose -f compose.production.yaml -f compose.recovery.yaml run --rm restore ...
name: beng-intellistore-production

services:
  # Consistent recovery generation. Systemd only invokes Compose; the logic runs
  # in the container. The destination is a NAS mount on the mini-PC.
  backup:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/scripts/backup_generation.sh"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:${INTELLISTORE_NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: intellistore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
      PGDATABASE: intellistore
      BACKUP_DIR: /backup
      ORIGINALS_DIR: /data/originals
      STATUS_FILE: /status/backup.json
      SUCCESS_FILE: /status/backup-last-success.json
      KEEP_GENERATIONS: ${INTELLISTORE_BACKUP_GENERATIONS:-7}
    volumes:
      - type: bind
        source: ${INTELLISTORE_HOST_DATA_DIR:?Set INTELLISTORE_HOST_DATA_DIR to an existing local directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INTELLISTORE_HOST_DATA_DIR:?Set INTELLISTORE_HOST_DATA_DIR to an existing local directory}/status
        target: /status
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_BACKUP_DIR:?Set INTELLISTORE_BACKUP_DIR to the NAS backup directory}
        target: /backup
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_COMPOSE_DIR:?Set INTELLISTORE_COMPOSE_DIR}/scripts
        target: /scripts
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Isolated restore target. Never point these paths at live data.
  restore:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/scripts/restore_generation.sh"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:${INTELLISTORE_NO_NEW_PRIVILEGES:-true}
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: intellistore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the systemd environment file}
      LIVE_DATABASE: intellistore
    volumes:
      - type: bind
        source: ${INTELLISTORE_BACKUP_DIR:?Set INTELLISTORE_BACKUP_DIR to the NAS backup directory}
        target: /backup
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INTELLISTORE_RESTORE_DIR:?Set INTELLISTORE_RESTORE_DIR to an isolated restore directory}
        target: /restore
        bind:
          create_host_path: true
      - type: bind
        source: ${INTELLISTORE_COMPOSE_DIR:?Set INTELLISTORE_COMPOSE_DIR}/scripts
        target: /scripts
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
