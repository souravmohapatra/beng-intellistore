# Dedicated project inference runtime for the laptop.
#
# Sourav selected a dedicated Docker inference service (decision D1) rather than
# reusing the existing native Ollama service. This file does not interfere with
# that service: it publishes only a loopback port and pins its own model/volume.
#
# Start (on the laptop, after host-change approval):
#   docker compose -f compose.inference.yaml up -d
# The worker container uses host networking, so it reaches the loopback-bound
# service directly:
#   INFERENCE_URL=http://127.0.0.1:11435
#
# The model is pinned by tag and expected digest in model-pin.txt. A tag alone is
# mutable, so verify the digest after pulling before treating the candidate as
# tested. Only this service's volume holds model weight data.
name: beng-intellistore-inference

services:
  inference:
    image: ollama/ollama:0.33.0
    ports:
      # Loopback only; the worker and the project application are the consumers.
      - "127.0.0.1:${INFERENCE_PORT:-11435}:11434"
    volumes:
      - inference-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${INFERENCE_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  inference-models:
